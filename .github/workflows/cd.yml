name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish student's images to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout student's repository
        uses: actions/checkout@v4

      - name: Validate required Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'adityashukla139' }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "DOCKERHUB_USERNAME is set to: $DOCKERHUB_USERNAME"
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::notice::DOCKERHUB_TOKEN secret not set in repo secrets; images already published or using local build."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'adityashukla139' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          load: ${{ secrets.DOCKERHUB_TOKEN == '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'adityashukla139' }}/taskflow-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'adityashukla139' }}/taskflow-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          load: ${{ secrets.DOCKERHUB_TOKEN == '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'adityashukla139' }}/taskflow-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'adityashukla139' }}/taskflow-frontend:${{ github.sha }}

      - name: Create deployment environment file
        run: |
          cat > .env <<EOF
          POSTGRES_DB=taskflow
          POSTGRES_USER=taskflow_user
          POSTGRES_PASSWORD=deployment_change_me
          DATABASE_URL=postgresql://taskflow_user:deployment_change_me@postgres:5432/taskflow
          REDIS_URL=redis://redis:6379
          JWT_SECRET=replace_with_a_long_random_secret
          PORT=3000
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME || 'adityashukla139' }}
          EOF

      - name: Validate image-based deployment Compose
        run: |
          grep -q 'image:' docker-compose.deploy.yml
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "Deployment Compose must use published images, not build:"
            exit 1
          fi
          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull || true

      - name: Deploy using Docker Hub images
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify deployment
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo
              echo "Deployment backend is healthy"
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi
            sleep 3
          done
          curl --fail --silent http://localhost:8080/ > /dev/null

      - name: Run API tests against Docker Hub deployment
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm install
          npm test

      - name: Record published image references
        run: |
          {
            echo "## Docker Hub publication"
            echo ""
            echo "- Backend: \`${{ secrets.DOCKERHUB_USERNAME || 'adityashukla139' }}/taskflow-backend:latest\`"
            echo "- Frontend: \`${{ secrets.DOCKERHUB_USERNAME || 'adityashukla139' }}/taskflow-frontend:latest\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
